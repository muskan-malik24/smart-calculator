
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Calculator</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <div class="calculator">
        <h1>Smart Calculator</h1>

        <input type="text" id="display" readonly placeholder="0">

        <div class="buttons">
            <button id="clearBtn" class="clear">C</button>
            <button id="backspaceBtn">⌫</button>
            <button class="operatorBtn">/</button>
            <button class="operatorBtn">*</button>

            <button class="numberBtn">7</button>
            <button class="numberBtn">8</button>
            <button class="numberBtn">9</button>
            <button class="operatorBtn">-</button>

            <button class="numberBtn">4</button>
            <button class="numberBtn">5</button>
            <button class="numberBtn">6</button>
            <button class="operatorBtn">+</button>

            <button class="numberBtn">1</button>
            <button class="numberBtn">2</button>
            <button class="numberBtn">3</button>
            <button id="equalBtn" class="equal">=</button>

            <button class="numberBtn zero">0</button>
            <button id="decimalBtn">.</button>
        </div>
    </div>

</body>
</html>
